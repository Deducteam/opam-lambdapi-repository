name: test packages

on:
  push:
    paths:
      - 'packages/**/opam'

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            packages/**/opam
      - name: Display changed files
        id: set
        run: |
          echo "Fichiers modifiés :"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do   
            echo "$file"
          done
          
          modifiedPkgs=$(
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            pkg=$(basename "$(dirname $file)")
            echo $pkg
          done
          )

          for file in $modifiedPkgs; do
            echo  pkg $file has been modified
          done

          json=$(printf '%s' "$modifiedPkgs" | jq -R . | jq -s '{include: map({ bin: .})}')
          # json=$(printf '%s' "$modifiedPkgs" | jq -R . | jq -s '{include: map({ bin: .}), has_items: true}')
          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  install-libraires:
    needs: get-changed-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-changed-files.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      - name: setup repository
        run: |
          opam repository -a --set-default add lambdapi .
      - name: install library ${{ matrix.bin }} 
        run: |
          echo "installing ${{ matrix.bin }}"
          opam install -y --deps-only "${{ matrix.bin }}"
          echo "done"


