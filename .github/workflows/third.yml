name: test packages

on:
  push

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            packages/**/opam
      - name: Display changed files
        id: set
        run: |
          echo "Fichiers modifiés :"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do   
            echo "$file"
          done
          
          modifiedPkgs=$(
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            pkg=$(basename "$(dirname "$(dirname $file)")")
            echo $pkg
          done
          )

          for file in $modifiedPkgs; do
            echo  pkg $file has been modified
          done

          if [ "$modifiedPkgs" = "[]" ]; then
            echo "has-items=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-items=true" >> "$GITHUB_OUTPUT"
          fi

          json=$(printf '%s' "$modifiedPkgs" | jq -R . | jq -s '{include: map({ bin: .}), "has-items": 'true'}')
          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  install-libraires:
    needs: get-changed-files
    if: ! needs.get-changed-files.outputs.has-items = 'true'
    runs-on: ubuntu-lates
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-changed-files.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      - name: setup repository
        run: |
          opam repository -a --set-default add lambdapi .
      - name: install library ${{ matrix.bin }} 
        run: |
          echo "installing ${{ matrix.bin }}"
          opam install -y --deps-only "${{ matrix.bin }}"

