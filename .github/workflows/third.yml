name: test packages

on:
  push

jobs:
  get-changed-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            packages/**/opam
      - name: Display changed files
        id: set
        run: |
          echo "Fichiers modifiés :"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do   
            echo "$file"
          done
          
          modifiedPkgs=$(
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            pkg=$(basename "$(dirname $file)")
            echo $pkg
          done
          )

          for file in $modifiedPkgs; do
            echo  pkg $file has been modified
          done

          json=$(printf '%s' "$modifiedPkgs" | jq -R . | jq -s '{include: map({ bin: ., has_items: true})}')
          # json=$(printf '%s' "$modifiedPkgs" | jq -R . | jq -s '{include: map({ bin: .}), has_items: true}')
          {
            echo "matrix<<EOF"
            echo "$json"
            echo "EOF"
          } >> $GITHUB_OUTPUT
  another_job:
    needs: get-changed-files
    runs-on: ubuntu-lates
    steps:
      - name: print
        run: pwd

