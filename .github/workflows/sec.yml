on:
  push:

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: setting up opam
        run: |
          sudo apt-get install -y opam
          opam init
          opam update
          opam depext -y .
          opam --version
          opam switch list-available ocaml-base-compiler
      - name: install ocaml switchs
        run: |
          opam switch create 5.4.1
          # opam switch create 5.4.0
          # opam switch create 5.3.0
          opam switch create 4.11.0
      - id: set
        run: |
          set -euo pipefail
        
          OCAML_VERSIONS=(
            5.4.1
            # 5.4.0
            # 5.3.0
            4.11.0
          )
        
          check_pkg () {
            local pkgdir="$1"
            local compiler="$2"
            opam install -y ./"$pkgdir" \
              --dry-run \
              --deps-only \
              --with-test \
              --switch=$compiler \
              # >/dev/null 2>&1
          }
        
          matrix='[]'
        
          while IFS= read -r pkgdir; do
            found=""
        
            for ver in "${OCAML_VERSIONS[@]}"; do
              echo "Cheking compatibility of lib " $pkgdir "with ocaml version " $ver
              if check_pkg "$pkgdir" "$ver"; then
                echo $pkgdir "is compatible with ocaml version " $ver
                found="$ver"
                break
              fi
            done
        
            if [ -n "$found" ]; then
              matrix=$(jq \
                --arg bin "$pkgdir" \
                --arg ocaml "$found" \
                '. + [{bin:$bin, "ocaml-version":$ocaml}]' \
                <<< "$matrix")
            else
              echo "No compatible compiler found for $pkgdir"
              exit 1
            fi
          done < <(find packages -type f -name opam -exec dirname {} \;)
        
          json=$(jq -n --argjson include "$matrix" '{include:$include}')
          
            {
              echo "matrix<<EOF"
              echo "$json"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          


  install-library-from-Opam-repo:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
      - name: install lib ${{ matrix.bin }}
        run: |
          if opam install -y --deps-only ${{ matrix.bin }} --switch=${{ matrix.ocaml-version }}; then
            echo ${{ matrix.bin }} " installed successfuly!"
          fi

  install-library-from-master:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: setting up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}
      - name: install dependencies from opam
        run: |
          opam repository -a --set-default add lambdapi https://github.com/deducteam/opam-lambdapi-repository.git

      - name: install library ${{ matrix.bin }} 
        run: |
          echo "installing ${{ matrix.bin }}"
          opam install -y --deps-only "${{ matrix.bin }}"